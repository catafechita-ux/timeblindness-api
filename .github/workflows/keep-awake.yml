# Pings the free Render service so it sleeps less often.
name: Keep Render awake
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS -m 90 "https://timeblindness-api.onrender.com/api/health"
