# Keeps the free Render service awake so the Family page opens fast.
# GitHub only starts scheduled runs every few hours (not every 12 minutes),
# so each run now stays alive and pings every 10 minutes for almost 6 hours.
# A newer run replaces the older one, so there is always one pinger running.
name: Keep Render awake
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
concurrency:
  group: keep-awake
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping health every 10 minutes
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -sS -m 90 -o /dev/null -w "%{http_code} %{time_total}s\n" "https://timeblindness-api.onrender.com/api/health" || true
            sleep 600
          done
